name: Toil WDL Spec Conformance - WDL 1.1

on:
  push:

jobs:
  conformance:
    runs-on: ubuntu-latest
    name: Run WDL 1.1 Spec Conformance Tests

    steps:
      - name: Checkout WDL spec repo (wdl-1.1)
        uses: actions/checkout@v4
        with:
          repository: openwdl/wdl
          ref: wdl-1.1
          path: wdl-spec

      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Toil WDL and dependencies
        run: |
          pip install toil[wdl] junit-xml subby

      - name: Clone WDL tests
        run: |
          git clone https://github.com/openwdl/wdl-tests.git

      - name: Extract tests
        run: |
          python wdl-tests/scripts/extract_tests.py -i ${{ github.workspace }}/SPEC.md -d ${{ github.workspace }}/tests/data/ -O toil_test -v 1.1

      - name: Run tests and capture results
        run: |
          mkdir -p toil_tests/artifacts
          python wdl-tests/scripts/run_tests_toil.py -T ${{ github.workspace }}/toil_test -c ${{ github.workspace }}/toil_test/test_config.json -D ${{ github.workspace }}/toil_test/data -O toil_results | tee toil_tests/artifacts/result.log

          echo "📊 Parsing test summary..."

          total=$(grep "Total tests:" toil_tests/artifacts/result.log | awk '{print $3}')
          passed=$(grep "Passed:" toil_tests/artifacts/result.log | awk '{print $2}')
          warnings=$(grep "Warnings:" toil_tests/artifacts/result.log | awk '{print $2}')
          failed=$(grep "Failures:" toil_tests/artifacts/result.log | awk '{print $2}')
          invalid=$(grep "Invalid outputs:" toil_tests/artifacts/result.log | awk '{print $3}')
          ignored=$(grep "Ignored:" toil_tests/artifacts/result.log | awk '{print $2}')

          # Write summary JSON
          cat <<EOF > toil_tests/artifacts/results.json
          {
            "total": $total,
            "passed": $passed,
            "warnings": $warnings,
            "failures": $failed,
            "invalid_outputs": $invalid,
            "ignored": $ignored
          }
          EOF

          # Write JUnit XML for GitHub UI annotations
          cat <<EOF > toil_tests/artifacts/results.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="Toil WDL 1.1 Conformance" tests="$total" failures="$failed" skipped="$ignored">
            <testcase classname="ToilWDL" name="wdl-1.1-conformance">
              $(if [ "$failed" -gt 0 ]; then echo "<failure message=\"Failures=$failed, Invalid=$invalid\"/>"; fi)
            </testcase>
          </testsuite>
          EOF

          # Copy list of failures to artifacts
          cp toil_test/failed_tests.txt toil_tests/artifacts/failed_tests.txt || true

          # Generate shields.io badge JSON
          color="green"
          if [ "$passed" -lt "$total" ]; then color="yellow"; fi
          if [ "$passed" -eq 0 ]; then color="red"; fi
          cat <<EOF > toil_tests/artifacts/shields.json
          {
            "schemaVersion": 1,
            "label": "Toil WDL 1.1",
            "message": "$passed/$total passed",
            "color": "$color"
          }
          EOF

          if [ "$failed" -gt 0 ] || [ "$invalid" -gt 0 ]; then
            echo "❌ One or more conformance tests failed or had invalid outputs."
          fi

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: toil-test-results
          path: toil_tests/artifacts/

      - name: Publish badge JSON to current branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          BRANCH="${GITHUB_REF_NAME}"
          RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          git fetch origin $BRANCH
          git checkout $BRANCH

          mkdir -p shields
          cp toil_tests/artifacts/shields.json shields/toil_shields.json
          git add shields/toil_shields.json

          # Update README only if needed
          badge_pattern='\[!\[Toil Tests\]\(https://img\.shields\.io/endpoint\?url=https://raw\.githubusercontent\.com/openwdl/wdl/[^)]*/shields/toil_shields\.json\)\]\(https://github\.com/openwdl/wdl/actions/runs/[0-9]+\)'
          badge_replacement="[![Toil Tests](https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/openwdl/wdl/$BRANCH/shields/toil_shields.json)]($RUN_URL)"
          if grep -qE "$badge_pattern" README.md; then
            git pull
            sed -i "s|$badge_pattern|$badge_replacement|" README.md
            git add README.md
          fi     

          if ! git diff --cached --quiet; then
            git commit -m "Update Toil WDL shields badge for $BRANCH"
            git push $REPO_URL $BRANCH
          else
            echo "🟢 No changes to commit"
          fi
